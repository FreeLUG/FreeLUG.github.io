<!doctype html>
<html lang="{{ site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <title>Page déplacée | {{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url | escape }}">
    <script>location.replace({{ page.redirect_to | relative_url | jsonify }} + location.search + location.hash);</script>
  </head>
  <body><p>Cette page a changé d’adresse. <a href="{{ page.redirect_to | relative_url }}">Consulter la publication</a>.</p></body>
</html>
