title: FreeLUG
lang: fr
url: https://www.freelug.org
baseurl: ""
collections:
  sections:
    output: true
  articles:
    output: true
  authors:
    output: true
  redirects:
    output: true
defaults:
  - scope:
      path: ""
      type: sections
    values:
      layout: section
  - scope:
      path: ""
      type: articles
    values:
      layout: article
  - scope:
      path: ""
      type: authors
    values:
      layout: author
  - scope:
      path: ""
      type: redirects
    values:
      layout: redirect
      sitemap: false
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - node_modules
  - package.json
  - package-lock.json
